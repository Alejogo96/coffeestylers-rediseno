name: Deploy to GitHub Pages

# Publishes main at the site root and, when they exist, the design concept branches
# at /concept-b/ and /concept-c/ (run manually via workflow_dispatch on main after pushing a concept branch; the Pages environment only allows deploys from main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: concept-b-hub
          path: site/concept-b
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: concept-c-journey
          path: site/concept-c
      - name: Remove git metadata from the published folder
        run: rm -rf site/.git site/concept-b/.git site/concept-c/.git
      - name: List what will be published
        run: ls -la site site/concept-b site/concept-c || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
